<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="오늘 먹을 한식 메뉴를 간단하게 추천받아 보세요."
    />
    <title>오늘의 메뉴 추천기</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="menu-card">
      <div class="icon" aria-hidden="true">🍚</div>
      <p class="eyebrow">오늘 뭐 먹지?</p>
      <h1>오늘의 메뉴 추천기</h1>
      <p class="description">고민은 잠시 내려놓고, 맛있는 한 끼를 골라보세요.</p>

      <section class="result-box" aria-live="polite" aria-atomic="true">
        <span class="result-label">오늘의 추천 메뉴</span>
        <strong id="menu-result">버튼을 눌러주세요!</strong>
      </section>

      <button id="recommend-button" type="button">메뉴 추천받기</button>
    </main>
  </body>
</html>
