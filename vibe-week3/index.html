<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>호기심으로 일상을 채우는 김하늘</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      color: #51495f;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(135deg, #fff1f5 0%, #f1edff 50%, #e8f8f5 100%);
    }

    .profile-card {
      width: min(100%, 680px);
      padding: 42px;
      text-align: center;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(121, 101, 145, 0.14);
      backdrop-filter: blur(10px);
    }

    .profile-image {
      width: 170px;
      height: 170px;
      object-fit: cover;
      border: 8px solid #fff7d6;
      border-radius: 50%;
      box-shadow: 0 10px 24px rgba(113, 96, 128, 0.16);
    }

    h1 {
      margin: 24px 0 8px;
      color: #705d7d;
      font-size: 2.4rem;
    }

    .intro {
      margin: 0 0 30px;
      color: #877791;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .favorites {
      padding: 26px 30px;
      text-align: left;
      background: #f7f2ff;
      border-radius: 24px;
    }

    h2 {
      margin: 0 0 18px;
      color: #705d7d;
      font-size: 1.25rem;
    }

    ul {
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
      list-style: none;
    }

    li {
      padding: 14px 18px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(121, 101, 145, 0.07);
    }

    li:nth-child(1) { border-left: 6px solid #ffc9d8; }
    li:nth-child(2) { border-left: 6px solid #c9c2f5; }
    li:nth-child(3) { border-left: 6px solid #afe3d5; }

    .mood {
      margin-top: 20px;
      padding: 26px 30px;
      background: #fff7fa;
      border-radius: 24px;
    }

    .mood-buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .mood-button {
      width: 64px;
      height: 64px;
      padding: 0;
      font-size: 1.8rem;
      cursor: pointer;
      background: #fff;
      border: 2px solid transparent;
      border-radius: 18px;
      box-shadow: 0 4px 12px rgba(121, 101, 145, 0.09);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .mood-button:hover {
      transform: translateY(-3px);
    }

    .mood-button:focus-visible {
      outline: 3px solid rgba(112, 93, 125, 0.3);
      outline-offset: 3px;
    }

    .mood-button[aria-pressed="true"] {
      background: #f7f2ff;
      border-color: #c9c2f5;
    }

    .mood-message {
      min-height: 29px;
      margin: 20px 0 0;
      color: #705d7d;
      font-weight: 600;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <img class="profile-image" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&amp;fit=crop&amp;w=400&amp;q=80" alt="김하늘 프로필 사진">
    <h1>호기심으로 일상을 채우는 김하늘</h1>
    <p class="intro">책과 음악, 산책 속 작은 발견으로 매일을 다정하게 채워갑니다.</p>

    <section class="favorites" aria-labelledby="favorites-title">
      <h2 id="favorites-title">내가 좋아하는 것</h2>
      <ul>
        <li>📚 포근한 카페에서 책 읽기</li>
        <li>🎧 좋아하는 음악으로 플레이리스트 만들기</li>
        <li>🌿 천천히 걸으며 새로운 풍경 발견하기</li>
      </ul>
    </section>

    <section class="mood" aria-labelledby="mood-title">
      <h2 id="mood-title">오늘, 마음은 어때요?</h2>
      <div class="mood-buttons" aria-label="오늘의 기분 선택">
        <button class="mood-button" type="button" data-message="설레는 마음을 따라가면 오늘이 조금 더 반짝일 거예요." aria-label="신나는 기분" aria-pressed="false">😊</button>
        <button class="mood-button" type="button" data-message="잠깐 숨을 고르세요. 여기까지 온 것만으로도 충분해요." aria-label="지친 기분" aria-pressed="false">😮‍💨</button>
        <button class="mood-button" type="button" data-message="마음이 무거운 날에도, 당신은 혼자가 아니에요." aria-label="속상한 기분" aria-pressed="false">🥺</button>
      </div>
      <p class="mood-message" aria-live="polite">지금 마음과 가장 닮은 이모지를 골라보세요.</p>
    </section>
  </main>

  <script>
    const moodButtons = document.querySelectorAll(".mood-button");
    const moodMessage = document.querySelector(".mood-message");

    moodButtons.forEach((button) => {
      button.addEventListener("click", () => {
        moodButtons.forEach((item) => item.setAttribute("aria-pressed", "false"));
        button.setAttribute("aria-pressed", "true");
        moodMessage.textContent = button.dataset.message;
      });
    });
  </script>
</body>
</html>
